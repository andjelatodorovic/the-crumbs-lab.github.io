{% assign section = page.url %}
{% if page.collection == 'members' %}{% assign section = '/team/' %}
{% elsif page.collection == 'projects' %}{% assign section = '/projects/' %}{% endif %}
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/logo/logo.png' | relative_url }}" alt="TRACE">
    </a>
    <nav>
      <ul>
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}" {% if section == item.url %}class="active"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
