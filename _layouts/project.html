---
layout: default
---
<article class="wrap page">
  <a class="back" href="{{ '/projects/' | relative_url }}">← All projects</a>
  <p class="eyebrow" style="margin-top:24px">Project{% if page.period %} · {{ page.period }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
