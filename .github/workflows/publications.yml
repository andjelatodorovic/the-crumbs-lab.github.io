name: Update publications

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "_pubsrc/**"
      - "_data/paper_links.yml"
      - "_members/**"
      - "_scripts/build_publications.py"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bibtexparser==1.4.1 pylatexenc pyyaml
      - run: python _scripts/build_publications.py
      - name: Commit and rebuild site if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- _data/publications.yml)" ]; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Update publications"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true